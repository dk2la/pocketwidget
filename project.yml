name: Pocket
options:
  bundleIdPrefix: com.dk2la
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  # Updates. See "Updates" in docs/release-and-licensing.md.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

targets:
  Pocket:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: Sparkle
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Pocket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        # Sparkle. The feed address is built into every released version, so
        # it must never change. Pocket checks once a day and asks before
        # installing.
        SUFeedURL: https://pocketwidget.tech/appcast.xml
        # Public half of the key that signs updates. The private half is in the
        # owner's keychain and in the SPARKLE_PRIVATE_KEY repository secret.
        SUPublicEDKey: UGjt//S00q5DK/MpoFjPEGxmvvIHk/KvveXXAm7Lxjo=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        NSHumanReadableCopyright: "© 2026 Danila Kozlov"
        NSAppleEventsUsageDescription: "Pocket controls your music players (Spotify, Apple Music) to show and manage playback from the widget."
        NSCalendarsUsageDescription: "Pocket shows your upcoming events in the widget."
        NSCalendarsFullAccessUsageDescription: "Pocket shows your upcoming events in the widget."
        NSMicrophoneUsageDescription: "Pocket records audio only while you dictate a note."
        NSSpeechRecognitionUsageDescription: "Pocket transcribes your dictation into note text."
    # Signing lives in the xcconfig: ad-hoc by default, overridable by a
    # gitignored Signing.local.xcconfig (stable cert → keychain stops asking).
    configFiles:
      Debug: Support/Signing.xcconfig
      Release: Support/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dk2la.pocket
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        # Drawn by Support/make-art.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Required for notarization. What it must allow is listed in the
        # entitlements file.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Support/Pocket.entitlements
    scheme:
      testTargets:
        - PocketTests
        - PocketUITests

  # Logic-only bundle: it compiles the pure mail parsing sources into itself,
  # so the tests need no app host and never touch Keychain or the network.
  PocketTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Support/Signing.xcconfig
      Release: Support/Signing.xcconfig
    sources:
      - path: Tests
      - path: Sources/Modules/Email/IMAPParser.swift
      - path: Sources/Modules/Email/MIMEDecode.swift
      - path: Sources/Modules/Email/MailComposer.swift
      - path: Sources/Modules/Email/EmailModels.swift
      - path: Sources/Modules/Assistant/OpenAIClient.swift
      - path: Sources/Modules/Assistant/AssistantModels.swift
      - path: Sources/Modules/Assistant/CLIAssistantClient.swift
      - path: Sources/Modules/Assistant/CommandLineEnvironment.swift
      - path: Sources/Modules/Assistant/AssistantSetup.swift
      - path: Sources/Services/SpeechCaptureService.swift
      - path: Sources/Core/WidgetGeometry.swift
      - path: Sources/Core/StripDisplay.swift
      - path: Sources/Modules/LiveEvents/LiveEvent.swift
      - path: Sources/Modules/LiveEvents/LiveEventGate.swift
      - path: Sources/Core/StripLineup.swift
      - path: Sources/Core/PanelHold.swift
      - path: Sources/Core/IconBadge.swift
      - path: Sources/Core/ModuleTab.swift
      - path: Sources/Core/WidgetPanelContent.swift
      - path: Sources/Modules/Shelf/ShelfStore.swift
      - path: Sources/Modules/Shelf/ShelfFilePicker.swift
      - path: Sources/Modules/Timers/TimerService.swift
      - path: Sources/Modules/Email/EmailHTMLSanitizer.swift
      - path: Sources/Modules/Email/MailTransport.swift
      - path: Sources/Modules/Email/IMAPClient.swift
      - path: Sources/Modules/Email/MailSession.swift
      - path: Sources/Modules/Email/MailSetup.swift
      - path: Sources/Modules/Clipboard/ClipboardHistory.swift
      - path: Sources/Licensing/AccessPorts.swift
      - path: Sources/Licensing/Access.swift
      - path: Sources/Licensing/MacID.swift
      - path: Sources/Licensing/PolarLicenseAPI.swift
      - path: Sources/Modules/Playbooks/PlaybooksRoute.swift
      - path: Sources/Modules/Hotkeys/ShortcutListState.swift
      - path: Sources/Modules/Playbooks/Playbook.swift
      - path: Sources/Modules/Playbooks/PlaybookStore.swift
      - path: Sources/Modules/Playbooks/PlaybookDraft.swift
      - path: Sources/Modules/Playbooks/AppVisuals.swift
      - path: Sources/Services/WindowLayout.swift
      - path: Sources/Core/Localization.swift
      - path: Sources/Modules/Metrics/MetricSelection.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dk2la.pocket.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  # Drives the real app (launched with --ui-testing, see UITestMode.swift).
  # Runs on GitHub-hosted runners only, never on a developer's Mac.
  PocketUITests:
    type: bundle.ui-testing
    platform: macOS
    configFiles:
      Debug: Support/Signing.xcconfig
      Release: Support/Signing.xcconfig
    sources:
      - path: UITests
    dependencies:
      - target: Pocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dk2la.pocket.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Pocket
