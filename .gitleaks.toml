[extend]
useDefault = true

# Keychain service identifiers are bundle-style names, not secrets.
[[allowlists]]
description = "Keychain service identifiers"
regexTarget = "line"
regexes = ['''keychainService\s*=\s*"com\.dk2la\.[a-z.]+"''']

# The sample License key from the Lemon Squeezy API documentation. Test
# fixtures used it before the store moved to Polar; it is still in the git
# history, which the scan covers. It is public and unlocks nothing.
[[allowlists]]
description = "Lemon Squeezy documentation sample License key"
regexes = ['''38b1460a-5104-4067-a91d-77b872934d51''']

# The public half of the key that signs Sparkle updates (`SUPublicEDKey`). It
# ships inside every copy of the app; only the private half is a secret.
[[allowlists]]
description = "Sparkle public update key"
regexes = ['''UGjt//S00q5DK/MpoFjPEGxmvvIHk/KvveXXAm7Lxjo=''']
