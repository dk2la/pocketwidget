name: Release

# Every push to master: run all checks, then build v<MARKETING_VERSION>,
# sign it with the Developer ID certificate, have Apple notarize it, and
# publish it to the Cloudflare R2 bucket (public downloads) and as a GitHub
# release.
# If that tag already exists the release is skipped — bump MARKETING_VERSION
# in project.yml to ship a new one.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    # Nothing to publish: do not take a macOS runner at all.
    if: needs.ci.outputs.released == 'false'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # The Apple Developer team that signs Pocket. Not a secret: it is
      # written in every signature.
      TEAM_ID: LZFYXRC8DH
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve version
        id: version
        run: |
          version=$(sed -nE 's/^ *MARKETING_VERSION: *"?([0-9.]+)"?.*/\1/p' project.yml | head -1)
          [[ -n "$version" ]] || { echo "::error::MARKETING_VERSION not found in project.yml"; exit 1; }
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag already released — bump MARKETING_VERSION in project.yml to publish a new version"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # The Developer ID certificate goes into a keychain that exists only
      # for this run.
      - name: Import signing certificate
        if: steps.version.outputs.exists == 'false'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          for var in P12_BASE64 P12_PASSWORD; do
            [[ -n "${!var}" ]] || { echo "::error::$var is empty — check the repository secrets"; exit 1; }
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application" \
            || { echo "::error::no Developer ID Application identity in DEVELOPER_ID_P12_BASE64"; exit 1; }

      # CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO keeps get-task-allow out of the
      # signature: notarization rejects it.
      - name: Build Release
        if: steps.version.outputs.exists == 'false'
        run: |
          rm -rf build
          xcodegen generate
          xcodebuild -project Pocket.xcodeproj -scheme Pocket -configuration Release \
            -derivedDataPath build CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual "CODE_SIGN_IDENTITY=Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" OTHER_CODE_SIGN_FLAGS=--timestamp \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO build \
            | grep -E "error:|warning: [^M]|\*\* " || true
          test "${PIPESTATUS[0]}" -eq 0
          # Sparkle's helper programs come signed ad-hoc; sign everything
          # again with the Developer ID, inside out.
          Support/sign-release.sh build/Build/Products/Release/Pocket.app

      # Apple checks the app, then the DMG that carries it. Each gets its
      # ticket stapled, so both open on a Mac that is offline. The published
      # zip is made from the stapled app.
      - name: Notarize and package
        if: steps.version.outputs.exists == 'false'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for var in NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            [[ -n "${!var}" ]] || { echo "::error::$var is empty — check the repository secrets"; exit 1; }
          done
          key="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$NOTARY_KEY_P8" > "$key"
          notarize() { # notarize <file>: fails, with Apple's log, unless accepted
            local out id
            out=$(xcrun notarytool submit "$1" --key "$key" --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" --wait --output-format json)
            echo "$out"
            if ! grep -q '"status" *: *"Accepted"' <<<"$out"; then
              id=$(sed -nE 's/.*"id" *: *"([^"]+)".*/\1/p' <<<"$out" | head -1)
              [[ -z "$id" ]] || xcrun notarytool log "$id" --key "$key" --key-id "$NOTARY_KEY_ID" \
                --issuer "$NOTARY_ISSUER_ID" || true
              echo "::error::Apple did not accept $1"
              return 1
            fi
          }

          app=build/Build/Products/Release/Pocket.app
          name="Pocket-${{ steps.version.outputs.version }}"
          mkdir -p dist

          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          notarize "$RUNNER_TEMP/notarize.zip"
          xcrun stapler staple "$app"
          ditto -c -k --keepParent "$app" "dist/$name.zip"

          staging=$(mktemp -d)
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname Pocket -srcfolder "$staging" -ov -format UDZO "dist/$name.dmg"
          rm -rf "$staging"
          codesign --sign "Developer ID Application" --timestamp "dist/$name.dmg"
          notarize "dist/$name.dmg"
          xcrun stapler staple "dist/$name.dmg"
          rm "$key"

          # What a buyer's Mac will decide on first open.
          spctl --assess --type execute --verbose=2 "$app"
          spctl --assess --type open --context context:primary-signature --verbose=2 "dist/$name.dmg"
          (cd dist && shasum -a 256 ./*.zip ./*.dmg > SHA256SUMS.txt)

      # The Sparkle feed: one item, this version, signed with the update key.
      # Installed copies of Pocket read it through
      # https://pocketwidget.tech/appcast.xml (see site/public/_redirects).
      - name: Write the update feed
        if: steps.version.outputs.exists == 'false'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for var in SPARKLE_PRIVATE_KEY R2_PUBLIC_URL; do
            [[ -n "${!var}" ]] || { echo "::error::$var is empty — check the repository secrets and variables"; exit 1; }
          done
          archives=$(mktemp -d)
          cp "dist/Pocket-$VERSION.dmg" "$archives/"
          echo "$SPARKLE_PRIVATE_KEY" | build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - --download-url-prefix "${R2_PUBLIC_URL%/}/v$VERSION/" \
            --link https://pocketwidget.tech --maximum-deltas 0 -o dist/appcast.xml "$archives"
          grep -q 'sparkle:edSignature=' dist/appcast.xml \
            || { echo "::error::the update feed has no signature"; exit 1; }
          cat dist/appcast.xml

      # Order matters. The whole job is skipped once the tag exists, and the tag
      # is created by `gh release create` below. So R2 goes first: if an upload
      # fails, the run fails with no tag, and a re-run rebuilds and uploads
      # again (uploads overwrite the same keys, so they are idempotent). Doing
      # it the other way round would leave a release that a re-run never
      # uploads to R2.
      - name: Upload to Cloudflare R2
        if: steps.version.outputs.exists == 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto # required by the CLI, ignored by R2
          # aws CLI >= 2.23 adds CRC checksums to every request by default.
          # Only send and validate them when the operation requires it, so the
          # upload does not depend on how R2 handles the newer algorithms.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.CLOUDFLARE_S3_ENDPOINT }}
          R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for var in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET R2_PUBLIC_URL; do
            [[ -n "${!var}" ]] || { echo "::error::$var is empty — check the repository secrets and variables"; exit 1; }
          done

          name="Pocket-$VERSION"
          public_url="${R2_PUBLIC_URL%/}"
          upload() { # upload <file> <key> <content-type> <cache-control>
            aws s3 cp "$1" "s3://$R2_BUCKET/$2" --endpoint-url "$R2_ENDPOINT" \
              --content-type "$3" --cache-control "$4" --only-show-errors
            echo "Uploaded $public_url/$2"
          }

          # Versioned files. Cached only briefly: a re-run after a failed
          # release step rebuilds the app and overwrites these keys, so caches
          # must not pin bytes that no longer match SHA256SUMS.txt.
          versioned="public, max-age=3600"
          upload "dist/$name.dmg" "v$VERSION/$name.dmg" application/x-apple-diskimage "$versioned"
          upload "dist/$name.zip" "v$VERSION/$name.zip" application/zip "$versioned"
          upload dist/SHA256SUMS.txt "v$VERSION/SHA256SUMS.txt" "text/plain; charset=utf-8" "$versioned"

          # Stable "latest" URL for the website's Download button. Uploaded
          # last, so it only moves once the versioned files are in place, and
          # always revalidated, so it never serves a stale version.
          upload "dist/$name.dmg" Pocket.dmg application/x-apple-diskimage no-cache

          # The update feed moves last of all: installed copies of Pocket
          # start offering this version once it is in place.
          upload dist/appcast.xml appcast.xml "application/xml; charset=utf-8" no-cache

          # The stable URL must serve this exact DMG without any login.
          expected=$(shasum -a 256 "dist/$name.dmg" | cut -d' ' -f1)
          # Download to a file: piping into shasum would hash a partial body
          # together with the retried one.
          check="$RUNNER_TEMP/Pocket-check.dmg"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$check" "$public_url/Pocket.dmg"
          actual=$(shasum -a 256 "$check" | cut -d' ' -f1)
          [[ "$actual" == "$expected" ]] || { echo "::error::$public_url/Pocket.dmg does not match the DMG built by this run"; exit 1; }

      - name: Publish GitHub release
        if: steps.version.outputs.exists == 'false'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "Pocket ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --notes "Signed with a Developer ID and notarized by Apple."
