name: CI

# Runs on GitHub-hosted runners only: lint and security on Linux,
# build and tests on macOS.
#
# macOS runners are slow to get, so build and tests run only for a release:
# when the target is master and v<MARKETING_VERSION> is not tagged yet (the
# pull request into master, and the Release workflow after the merge), or
# when the workflow is started by hand. Everything else gets lint and
# security only.
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]
  workflow_call:
    outputs:
      released:
        description: "'true' when v<MARKETING_VERSION> is already tagged"
        value: ${{ jobs.plan.outputs.released }}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether this run needs the macOS build.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      released: ${{ steps.plan.outputs.released }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          # The branch this run is for: the base of a pull request, or the
          # pushed branch.
          TARGET: ${{ github.base_ref || github.ref_name }}
        run: |
          version=$(sed -nE 's/^ *MARKETING_VERSION: *"?([0-9.]+)"?.*/\1/p' project.yml | head -1)
          [[ -n "$version" ]] || { echo "::error::MARKETING_VERSION not found in project.yml"; exit 1; }
          if [[ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]]; then released=true; else released=false; fi
          build=false
          if [[ "$EVENT" == "workflow_dispatch" ]]; then build=true; fi
          if [[ "$TARGET" == "master" && "$released" == "false" ]]; then build=true; fi
          echo "released=$released" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "::notice::v$version released: $released, macOS build: $build"

  swiftlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: swiftlint lint --quiet --reporter github-actions-logging

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - name: Workflow lint (actionlint)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Secret scan (gitleaks)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --no-banner --redact --config .gitleaks.toml

      - name: Security scan (semgrep)
        run: |
          pipx install semgrep==1.184.0
          semgrep scan --config p/swift --config p/secrets --metrics off --error Sources Tests UITests

  build-test:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and test
        run: ./run.sh --clean --test --no-run
      # run.sh runs the unit tests only; the UI tests launch the app with
      # --ui-testing (throwaway defaults, no tour, no prompts) and drive it,
      # which only a GitHub-hosted runner may do.
      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild -project Pocket.xcodeproj -scheme Pocket -configuration Debug \
            -derivedDataPath build test -only-testing:PocketUITests 2>&1 |
            grep -E "error:|warning: [^M]|Test Case|Executed [0-9]+ tests|\*\* "
