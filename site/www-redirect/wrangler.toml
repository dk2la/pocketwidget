name = "pocket-site-www"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = false

# Only the www name is attached here; the site itself is the Worker in
# ../wrangler.toml.
routes = [{ pattern = "www.pocketwidget.tech", custom_domain = true }]

# Request logs, kept in Cloudflare (Workers Logs). Traces stay off.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
